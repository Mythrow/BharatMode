name: Validate story briefs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-stories.mjs
      - run: node scripts/check-brand.mjs

      - run: node scripts/check-logo-assets.mjs
      - run: node scripts/test-chapters.mjs
      - run: node scripts/test-motion-v2-timing.mjs
      - run: node scripts/test-motion-v3-timing.mjs
      - run: node scripts/test-motion-v4-timing.mjs
      - run: node scripts/test-motion-v5-timing.mjs
      - run: node scripts/test-motion-v6-timing.mjs
      - run: node scripts/test-approved-template.mjs
      - run: node scripts/check-channel-cover.mjs
